<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murano Live Glass - 15 Minutes</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

.screen {
    width: 100vw;
    height: 100vh;

    background:
        radial-gradient(circle at 50% 42%,
        #1b2831 0%,
        #0b1117 42%,
        #030506 75%,
        #000 100%);

    display: flex;
    flex-direction: column;
    align-items: center;

    position: relative;
    text-align: center;
}

/* LOGO/TITOLO SUPERIORE */

.brand {
    margin-top: 4vh;
    font-size: clamp(18px, 2vw, 32px);
    letter-spacing: 12px;
    padding-left: 12px;
    font-weight: 300;
}

.goldline {
    width: min(420px, 35vw);
    height: 1px;

    margin-top: 1.4vh;

    background: linear-gradient(
        90deg,
        transparent,
        #d8b866,
        transparent
    );
}

.subbrand {
    margin-top: 1vh;

    color: #d8b866;

    font-size: clamp(11px, 1vw, 17px);

    letter-spacing: 6px;
}


/* CONTENUTO CENTRALE */

.main {
    position: absolute;

    top: 19%;

    left: 0;

    width: 100%;
}

.experience {
    color: #d8b866;

    font-size: clamp(12px, 1.15vw, 19px);

    letter-spacing: 6px;

    margin-bottom: 1.5vh;
}

.title {
    font-family: Georgia, "Times New Roman", serif;

    font-size: clamp(42px, 5vw, 86px);

    line-height: 1.02;

    letter-spacing: 2px;

    font-weight: normal;
}

.every {
    margin-top: 2vh;

    font-size: clamp(14px, 1.5vw, 25px);

    letter-spacing: 6px;

    color: #d0d0d0;
}


/* COUNTDOWN */

#countdown {
    margin-top: 1vh;

    font-size: clamp(130px, 16vw, 300px);

    line-height: .95;

    font-weight: 200;

    letter-spacing: -7px;

    font-variant-numeric: tabular-nums;

    transition: color .4s ease;
}


.next {
    margin-top: 1.2vh;

    color: #d8b866;

    font-size: clamp(12px, 1.1vw, 19px);

    letter-spacing: 6px;
}


#message {
    margin-top: 1vh;

    font-size: clamp(15px, 1.4vw, 24px);

    color: #ddd;

    line-height: 1.4;
}


/* PARTE INFERIORE */

.footer {
    position: absolute;

    bottom: 4vh;

    width: 100%;

    color: #777;

    font-size: clamp(10px, .9vw, 15px);

    letter-spacing: 5px;
}

.footer-line {
    width: min(600px, 40vw);

    height: 1px;

    margin: 0 auto 1.5vh auto;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(216,184,102,.7),
        transparent
    );
}


/* TV CON SCHERMO PIÙ BASSO */

@media (max-height: 700px) {

    .brand {
        margin-top: 2.5vh;
    }

    .main {
        top: 15%;
    }

    #countdown {
        font-size: 14vw;
    }

    .footer {
        bottom: 2vh;
    }
}
</style>
</head>


<body>

<div class="screen">

    <div class="brand">
        MURANO
    </div>

    <div class="goldline"></div>

    <div class="subbrand">
        LIVE GLASS
    </div>


    <main class="main">

        <div class="experience">
            LIVE EXPERIENCE
        </div>

        <div class="title">
            LIVE GLASS-BLOWING<br>
            DEMONSTRATION
        </div>

        <div class="every">
            EVERY 15 MINUTES
        </div>


        <div id="countdown">
            15:00
        </div>


        <div class="next">
            NEXT DEMONSTRATION
        </div>


        <div id="message">
            A new demonstration begins every 15 minutes
        </div>

    </main>


    <footer class="footer">

        <div class="footer-line"></div>

        THE ART OF MURANO GLASS • LIVE

    </footer>

</div>


<script>

function updateCountdown() {

    const now = new Date();

    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    const milliseconds = now.getMilliseconds();

    let nextMinute;

    if (minutes < 15) {
        nextMinute = 15;
    }
    else if (minutes < 30) {
        nextMinute = 30;
    }
    else if (minutes < 45) {
        nextMinute = 45;
    }
    else {
        nextMinute = 60;
    }

    let remaining =
        ((nextMinute - minutes) * 60)
        - seconds
        - (milliseconds / 1000);

    remaining = Math.ceil(remaining);

    if (remaining <= 0) {
        remaining = 900;
    }


    const mins =
        Math.floor(remaining / 60);

    const secs =
        remaining % 60;


    const countdown =
        document.getElementById("countdown");

    const message =
        document.getElementById("message");


    countdown.textContent =
        String(mins).padStart(2,"0")
        + ":"
        + String(secs).padStart(2,"0");


    /* ULTIMI 30 SECONDI */

    if (remaining <= 30) {

        countdown.style.color = "#e4c36f";

        message.style.color = "#ffffff";
        message.style.fontWeight = "bold";
        message.style.fontSize =
            "clamp(18px, 1.8vw, 30px)";

        message.innerHTML =
            "THE DEMONSTRATION IS ABOUT TO BEGIN"
            + "<br>"
            + "ACCESS TO THE FURNACE IS NOW PERMITTED";

    }

    else {

        countdown.style.color = "#ffffff";

        message.style.color = "#dddddd";
        message.style.fontWeight = "normal";
        message.style.fontSize =
            "clamp(15px, 1.4vw, 24px)";

        message.textContent =
            "A new demonstration begins every 15 minutes";
    }
}


updateCountdown();

setInterval(updateCountdown,250);

</script>

</body>
</html>

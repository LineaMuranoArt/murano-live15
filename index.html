<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murano Live Glass - 15 Minutes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:white;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 28% 40%,rgba(150,105,45,.18),transparent 38%),
        radial-gradient(circle at 76% 48%,rgba(95,55,20,.12),transparent 42%),
        linear-gradient(135deg,#050505 0%,#0b0b0b 45%,#020202 100%);
}

.page:before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(90deg,transparent 0%,rgba(220,178,95,.035) 48%,transparent 100%);
}

/* HEADER */

.header{
    position:absolute;
    top:4vh;
    left:5vw;
    right:5vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:2;
}

.logo-main{
    font-family:Georgia,"Times New Roman",serif;
    font-size:2.15vw;
    letter-spacing:.34vw;
}

.logo-sub{
    margin-top:.55vh;
    font-size:.72vw;
    letter-spacing:.34vw;
    color:#d3aa61;
}

.company{
    font-size:.72vw;
    letter-spacing:.25vw;
    color:#777;
}

.header-line{
    position:absolute;
    left:5vw;
    right:5vw;
    top:11vh;
    height:1px;
    background:linear-gradient(90deg,#b8863f,rgba(184,134,63,.14),transparent);
}


/* MAIN */

.main-left{
    position:absolute;
    left:5vw;
    top:17vh;
    width:55vw;
}

.live-row{
    display:flex;
    align-items:center;
    gap:1vw;
    margin-bottom:1.8vh;
}

.live-badge{
    background:#c40000;
    color:white;
    font-weight:bold;
    font-size:.82vw;
    letter-spacing:.18vw;
    padding:.55vh .75vw;
    border-radius:2px;
    box-shadow:0 0 18px rgba(196,0,0,.18);
}

.kicker{
    font-size:.86vw;
    letter-spacing:.32vw;
    color:#d3aa61;
}

.title{
    font-family:Georgia,"Times New Roman",serif;
    font-size:4.55vw;
    line-height:.98;
    font-weight:normal;
    letter-spacing:.02vw;
}

.subtitle{
    margin-top:2vh;
    font-size:1.16vw;
    letter-spacing:.30vw;
    color:#ccc;
}


/* TIMER */

#countdown{
    margin-top:.7vh;
    font-size:13.3vw;
    line-height:.88;
    font-weight:200;
    letter-spacing:-.45vw;
    font-variant-numeric:tabular-nums;
    transition:color .3s ease,text-shadow .3s ease;
}

.next{
    margin-top:1.3vh;
    font-size:.84vw;
    letter-spacing:.28vw;
    color:#d3aa61;
}

#message{
    margin-top:.9vh;
    font-size:1.12vw;
    line-height:1.45;
    color:#d8d8d8;
}


/* VIDEO */

.avatar-zone{
    position:absolute;
    right:4.5vw;
    top:16vh;
    width:31vw;
    height:69vh;
}

.avatar-shell{
    position:absolute;
    inset:0;
    overflow:hidden;

    background:#090909;

    border:1px solid rgba(211,170,97,.28);

    box-shadow:
        0 0 40px rgba(0,0,0,.45),
        inset 0 0 40px rgba(211,170,97,.025);
}

.avatar-shell:before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(255,255,255,.035);
    pointer-events:none;
    z-index:3;
}

.video-wrap{
    position:absolute;
    inset:0;
    overflow:hidden;
}

/* YouTube iframe */
#player{
    position:absolute;
    top:50%;
    left:50%;
    width:122%;
    height:122%;
    transform:translate(-50%,-50%);
    border:0;
}

/* overlay per primo avvio audio */
.start-overlay{
    position:absolute;
    inset:0;
    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        linear-gradient(180deg,rgba(5,5,5,.92),rgba(5,5,5,.80));

    cursor:pointer;
}

.start-overlay.hidden{
    display:none;
}

.start-live{
    background:#c40000;
    color:#fff;
    font-weight:bold;
    font-size:1vw;
    letter-spacing:.18vw;
    padding:1.3vh 1.4vw;
    border:none;
    border-radius:3px;
}

.start-note{
    margin-top:1.4vh;
    font-size:.78vw;
    letter-spacing:.10vw;
    color:#aaa;
}


/* FOOTER */

.footer{
    position:absolute;
    left:5vw;
    right:5vw;
    bottom:3.5vh;

    display:flex;
    justify-content:space-between;
    align-items:center;

    font-size:.68vw;
    letter-spacing:.24vw;
    color:#707070;
}

.footer-line{
    position:absolute;
    left:0;
    right:0;
    top:-2vh;
    height:1px;
    background:linear-gradient(90deg,rgba(211,170,97,.5),rgba(211,170,97,.1),transparent);
}


/* LAST 30 SECONDS */

.starting #countdown{
    color:#e5bd6d;
    text-shadow:0 0 34px rgba(229,189,109,.20);
}

.starting #message{
    color:#fff;
    font-size:1.35vw;
    font-weight:bold;
}

@media(max-height:720px){

    .main-left{
        top:15vh;
    }

    .avatar-zone{
        top:15vh;
        height:70vh;
    }

    #countdown{
        font-size:12.2vw;
    }

    .title{
        font-size:4.25vw;
    }
}
</style>
</head>

<body>

<div class="page" id="page">

    <div class="header">

        <div>
            <div class="logo-main">MURANO</div>
            <div class="logo-sub">LIVE GLASS EXPERIENCE</div>
        </div>

        <div class="company">
            LINEA MURANO ART
        </div>

    </div>

    <div class="header-line"></div>


    <section class="main-left">

        <div class="live-row">

            <div class="live-badge">
                LIVE
            </div>

            <div class="kicker">
                LIVE IN MURANO
            </div>

        </div>

        <h1 class="title">
            LIVE GLASS-BLOWING<br>
            DEMONSTRATION
        </h1>

        <div class="subtitle">
            EVERY 15 MINUTES
        </div>

        <div id="countdown">
            15:00
        </div>

        <div class="next">
            NEXT DEMONSTRATION
        </div>

        <div id="message">
            Discover the art of Murano glass, live in our furnace.
        </div>

    </section>


    <aside class="avatar-zone">

        <div class="avatar-shell">

            <div class="video-wrap">

                <div id="player"></div>

            </div>

            <div class="start-overlay" id="startOverlay">

                <button class="start-live">
                    START LIVE EXPERIENCE
                </button>

                <div class="start-note">
                    Tap once to enable audio
                </div>

            </div>

        </div>

    </aside>


    <footer class="footer">

        <div class="footer-line"></div>

        <div>
            THE ART OF MURANO GLASS • LIVE
        </div>

        <div>
            VENICE • ITALY
        </div>

    </footer>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;

function onYouTubeIframeAPIReady(){

    player = new YT.Player('player',{

        videoId:'fnaTZhE2lyo',

        playerVars:{
            autoplay:0,
            controls:0,
            rel:0,
            modestbranding:1,
            playsinline:1,
            disablekb:1,
            fs:0,
            loop:1,
            playlist:'fnaTZhE2lyo'
        },

        events:{
            onReady:function(){

                /* pronto, attende il primo click */

            },

            onStateChange:function(event){

                if(event.data === YT.PlayerState.ENDED){

                    player.seekTo(0);
                    player.playVideo();

                }

            }
        }

    });

}


/* primo click per abilitare audio */

document.getElementById("startOverlay").addEventListener("click",function(){

    if(player){

        player.unMute();
        player.setVolume(100);
        player.playVideo();

        document.getElementById("startOverlay").classList.add("hidden");

    }

});


/* COUNTDOWN */

(function(){

    const page =
        document.getElementById("page");

    const countdown =
        document.getElementById("countdown");

    const message =
        document.getElementById("message");


    function updateCountdown(){

        const now = new Date();

        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const milliseconds = now.getMilliseconds();

        let nextMinute;

        if(minutes < 15){
            nextMinute = 15;
        }
        else if(minutes < 30){
            nextMinute = 30;
        }
        else if(minutes < 45){
            nextMinute = 45;
        }
        else{
            nextMinute = 60;
        }

        let remaining =
            ((nextMinute - minutes) * 60)
            - seconds
            - (milliseconds / 1000);

        remaining = Math.ceil(remaining);

        if(remaining <= 0){
            remaining = 900;
        }

        const mins =
            Math.floor(remaining / 60);

        const secs =
            remaining % 60;

        countdown.textContent =
            String(mins).padStart(2,"0")
            + ":"
            + String(secs).padStart(2,"0");


        if(remaining <= 30){

            page.classList.add("starting");

            message.innerHTML =
                "THE DEMONSTRATION IS ABOUT TO BEGIN"
                + "<br>"
                + "ACCESS TO THE FURNACE IS NOW PERMITTED";

        }
        else{

            page.classList.remove("starting");

            message.innerHTML =
                "Discover the art of Murano glass, live in our furnace.";
        }

    }

    updateCountdown();

    setInterval(updateCountdown,250);

})();

</script>

</body>
</html>

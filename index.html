<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Linea Murano Art - Live Glass</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020304;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

.page{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(circle at 22% 42%,rgba(40,60,70,.10),transparent 34%),
    radial-gradient(circle at 76% 50%,rgba(255,35,20,.045),transparent 38%),
    linear-gradient(135deg,#020304,#080a0c 48%,#010101);
}


/* =========================
   LOGO
========================= */

.logo{
  position:absolute;
  left:3.1vw;
  top:3.2vh;
  z-index:10;
}

.logo-linea{
  font-size:2.65vw;
  line-height:.9;
  font-weight:300;
  letter-spacing:.45vw;

  background:linear-gradient(
    180deg,
    #fff 0%,
    #eee 35%,
    #777 60%,
    #fafafa 100%
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.logo-sub{
  margin-top:.75vh;
  margin-left:.2vw;

  font-size:.67vw;
  letter-spacing:.43vw;

  color:#aaa;
}


/* =========================
   LEFT
========================= */

.left{
  position:absolute;
  left:3vw;
  top:16vh;

  width:39vw;
}


/* =========================
   LIVE
========================= */

.live-pill{
  display:inline-flex;
  align-items:center;

  gap:1.15vw;

  padding:
    1.35vh
    2.1vw
    1.35vh
    1.35vw;

  border-radius:999px;

  border:2px solid #ff342c;

  background:
    linear-gradient(
      180deg,
      rgba(225,20,15,.94),
      rgba(110,0,0,.96)
    );

  box-shadow:
    0 0 15px rgba(255,25,15,.55),
    0 0 35px rgba(255,25,15,.20),
    inset 0 1px 2px rgba(255,255,255,.32);
}

.live-dot{
  width:2.4vw;
  height:2.4vw;

  min-width:22px;
  min-height:22px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 8px #fff,
    0 0 18px #ff4b42,
    0 0 30px #ff2118;

  animation:pulse 1.5s infinite;
}

@keyframes pulse{

  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.72;
    transform:scale(.88);
  }
}

.live-text{
  font-size:2.8vw;
  font-weight:600;

  letter-spacing:.10vw;

  background:
    linear-gradient(
      180deg,
      #fff,
      #e5e5e5 45%,
      #999 72%,
      #fff
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}


/* =========================
   TITLE
========================= */

.title{
  margin-top:3.2vh;

  font-family:
    "Orbitron",
    Arial,
    sans-serif;

  font-size:2.55vw;

  line-height:1.25;

  letter-spacing:.01vw;

  font-weight:700;

  background:
    linear-gradient(
      180deg,
      #fff 0%,
      #ddd 36%,
      #777 60%,
      #eee 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}


/* =========================
   EVERY 15
========================= */

.every-row{
  margin-top:2.2vh;

  display:flex;
  align-items:center;

  gap:1.2vw;
}

.blue-line{
  width:6.5vw;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00a8ff
    );
}

.red-line{
  width:6.5vw;
  height:2px;

  background:
    linear-gradient(
      90deg,
      #ff2118,
      transparent
    );
}

.every{
  white-space:nowrap;

  font-size:1.08vw;
  letter-spacing:.35vw;

  color:#ddd;
}


/* =========================
   TIMER PANEL
========================= */

.timer-panel{
  position:relative;

  margin-top:2.3vh;

  width:37vw;
  height:19vh;

  min-height:145px;

  display:flex;
  align-items:center;
  justify-content:center;

  clip-path:
    polygon(
      7% 0,
      94% 0,
      100% 18%,
      100% 82%,
      94% 100%,
      7% 100%,
      0 82%,
      0 18%
    );

  background:
    linear-gradient(
      110deg,
      #050709 0%,
      #15191d 48%,
      #050506 100%
    );

  border:1px solid #555;

  box-shadow:
    inset 0 0 30px rgba(255,255,255,.035),
    0 0 25px rgba(0,0,0,.8);
}

.timer-panel:before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,170,255,.55),
      transparent 22%,
      transparent 78%,
      rgba(255,30,20,.55)
    );

  opacity:.35;
}


/* =========================
   COUNTDOWN MODERNO
========================= */

#countdown{

  position:relative;

  z-index:2;

  font-family:
    "Orbitron",
    Arial,
    sans-serif;

  font-size:7.25vw;

  line-height:1;

  font-weight:700;

  letter-spacing:-.38vw;

  font-variant-numeric:
    tabular-nums;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #f4f4f4 22%,
      #a4a4a4 48%,
      #5f6265 60%,
      #d8d8d8 82%,
      #ffffff 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  filter:
    drop-shadow(0 2px 0 #000)
    drop-shadow(0 0 4px rgba(255,255,255,.18));
}


/* COLON ROSSO */

.timer-colon{
  color:#ff2118;
}


/* =========================
   NEXT
========================= */

.next{
  margin-top:2vh;

  text-align:center;

  font-size:1.02vw;
  letter-spacing:.34vw;

  color:#ff3027;
}

.next-line{
  width:30vw;

  height:1px;

  margin:.8vh auto 0;

  background:
    linear-gradient(
      90deg,
      transparent,
      #555,
      #ff3027,
      #555,
      transparent
    );
}

.next-dot{
  width:9px;
  height:9px;

  margin:-5px auto 0;

  border-radius:50%;

  background:#ff3027;

  box-shadow:
    0 0 6px #ff3027,
    0 0 13px rgba(255,48,39,.7);
}

#message{
  margin-top:2vh;

  padding-left:1.3vw;

  border-left:2px solid #ff3027;

  font-size:1.16vw;

  line-height:1.45;

  color:#e5e5e5;
}


/* =========================
   AVATAR FRAME
========================= */

.avatar-zone{
  position:absolute;

  right:2.8vw;
  top:10vh;

  width:52vw;
  height:73vh;

  border-radius:24px;

  overflow:hidden;

  background:#000;

  border:
    1px solid
    rgba(255,255,255,.14);

  box-shadow:
    -2px 0 0 #00a8ff,
    2px 0 0 #ff2118,
    0 0 28px rgba(0,0,0,.8);
}

.avatar-zone:after{

  content:"";

  position:absolute;

  inset:0;

  z-index:8;

  pointer-events:none;

  border-radius:23px;

  box-shadow:
    inset 2px 0 3px rgba(0,168,255,.55),
    inset -2px 0 3px rgba(255,33,24,.55);
}


/* =========================
   YOUTUBE PLAYER
========================= */

/*
  Video un po' più grande e più alto.
  Non usiamo più il taglio esagerato precedente.
*/

#player{

  position:absolute;

  left:50%;

  top:45%;

  width:118%;
  height:118%;

  transform:
    translate(
      -50%,
      -50%
    );

  border:0;
}


/* =========================
   MASCHERA SOTTOTITOLI
========================= */

/*
  Questa fascia sta SOPRA il player.
  Copre tutta la zona in cui YouTube
  visualizza normalmente una o due
  righe di sottotitoli.

  Non dipende dalle impostazioni CC
  di YouTube.
*/

.caption-mask{

  position:absolute;

  z-index:7;

  left:0;
  right:0;
  bottom:0;

  height:14%;

  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,.92) 25%,
      #000 48%,
      #000 100%
    );
}


/* =========================
   START AUDIO
========================= */

#startOverlay{

  position:absolute;

  inset:0;

  z-index:20;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  background:
    rgba(0,0,0,.76);

  cursor:pointer;
}

#startOverlay.hidden{
  display:none;
}

.start-button{

  border:
    2px solid
    #ff3027;

  border-radius:999px;

  padding:
    1.1vh
    1.7vw;

  background:
    linear-gradient(
      180deg,
      #d51b14,
      #720000
    );

  color:#fff;

  font-size:1.05vw;
  font-weight:bold;

  letter-spacing:.12vw;

  box-shadow:
    0 0 20px
    rgba(255,30,20,.45);
}

.start-small{

  margin-top:1.2vh;

  font-size:.72vw;

  letter-spacing:.12vw;

  color:#aaa;
}


/* =========================
   FOOTER
========================= */

.footer{

  position:absolute;

  left:3vw;
  right:3vw;
  bottom:2.6vh;

  border-top:
    1px solid
    #343434;

  padding-top:2vh;

  text-align:center;

  font-size:.75vw;

  letter-spacing:.42vw;

  color:#888;
}

.footer-live{
  color:#ff3027;
}


/* =========================
   LAST 30 SEC
========================= */

.starting .timer-panel{

  box-shadow:
    inset 0 0 30px rgba(255,35,20,.08),
    0 0 28px rgba(255,30,20,.20);
}

.starting #message{

  color:#fff;

  font-weight:bold;
}


/* TV PIÙ BASSE */

@media(max-height:720px){

  .left{
    top:14vh;
  }

  .avatar-zone{
    top:9vh;
    height:74vh;
  }

  .title{
    font-size:2.3vw;
  }

  #countdown{
    font-size:6.7vw;
  }

}

</style>
</head>


<body>

<div
  class="page"
  id="page"
>


  <div class="logo">

    <div class="logo-linea">
      LINEA
    </div>

    <div class="logo-sub">
      MURANO ART
    </div>

  </div>



  <section class="left">


    <div class="live-pill">

      <div class="live-dot"></div>

      <div class="live-text">
        LIVE
      </div>

    </div>



    <div class="title">

      LIVE GLASS-BLOWING
      <br>

      DEMONSTRATION

    </div>



    <div class="every-row">

      <div class="blue-line"></div>

      <div class="every">
        EVERY 15 MINUTES
      </div>

      <div class="red-line"></div>

    </div>



    <div class="timer-panel">

      <div id="countdown">
        15:00
      </div>

    </div>



    <div class="next">

      NEXT DEMONSTRATION

    </div>

    <div class="next-line"></div>

    <div class="next-dot"></div>



    <div id="message">

      Discover the art of Murano glass,
      <br>

      live in our furnace.

    </div>


  </section>



  <aside class="avatar-zone">


    <div id="player"></div>


    <!-- COPERTURA SOTTOTITOLI -->
    <div class="caption-mask"></div>


    <div id="startOverlay">

      <div class="start-button">

        ● &nbsp;
        START LIVE EXPERIENCE

      </div>

      <div class="start-small">

        TAP ONCE TO ENABLE AUDIO

      </div>

    </div>


  </aside>



  <footer class="footer">

    THE ART OF MURANO GLASS •

    <span class="footer-live">
      LIVE
    </span>

  </footer>


</div>



<script
src="https://www.youtube.com/iframe_api">
</script>


<script>

/* YOUTUBE */

let player;


function onYouTubeIframeAPIReady(){

  player =
    new YT.Player(
      "player",
      {

        videoId:
          "fnaTZhE2lyo",

        playerVars:{

          autoplay:0,

          controls:0,

          rel:0,

          playsinline:1,

          disablekb:1,

          fs:0,

          loop:1,

          playlist:
            "fnaTZhE2lyo",

          iv_load_policy:3

        },


        events:{

          onStateChange:
          function(event){

            if(
              event.data ===
              YT.PlayerState.ENDED
            ){

              player.seekTo(0);

              player.playVideo();

            }

          }

        }

      }
    );

}



/* START */

document
.getElementById(
  "startOverlay"
)
.addEventListener(
  "click",
  function(){

    if(player){

      player.unMute();

      player.setVolume(100);

      player.playVideo();


      document
      .getElementById(
        "startOverlay"
      )
      .classList
      .add("hidden");

    }

  }
);



/* COUNTDOWN */

(function(){


  const page =
    document.getElementById(
      "page"
    );


  const countdown =
    document.getElementById(
      "countdown"
    );


  const message =
    document.getElementById(
      "message"
    );



  function
  updateCountdown(){


    const now =
      new Date();


    const minutes =
      now.getMinutes();


    const seconds =
      now.getSeconds();


    const milliseconds =
      now.getMilliseconds();



    let nextMinute;



    if(minutes < 15){

      nextMinute = 15;

    }

    else if(minutes < 30){

      nextMinute = 30;

    }

    else if(minutes < 45){

      nextMinute = 45;

    }

    else{

      nextMinute = 60;

    }



    let remaining =

      ((nextMinute - minutes) * 60)

      - seconds

      - (milliseconds / 1000);



    remaining =
      Math.ceil(
        remaining
      );



    if(
      remaining <= 0
    ){

      remaining = 900;

    }



    const mins =

      Math.floor(
        remaining / 60
      );


    const secs =

      remaining % 60;



    /*
      COLON ROSSO
    */

    countdown.innerHTML =

      String(mins)
      .padStart(
        2,
        "0"
      )

      +

      '<span style="' +
      'color:#ff2118;' +
      '-webkit-text-fill-color:#ff2118;' +
      'text-shadow:0 0 10px rgba(255,33,24,.65);' +
      '">:</span>'

      +

      String(secs)
      .padStart(
        2,
        "0"
      );



    if(
      remaining <= 30
    ){


      page
      .classList
      .add(
        "starting"
      );


      message.innerHTML =

        "THE DEMONSTRATION IS ABOUT TO BEGIN"

        +

        "<br>"

        +

        "ACCESS TO THE FURNACE IS NOW PERMITTED";


    }


    else{


      page
      .classList
      .remove(
        "starting"
      );


      message.innerHTML =

        "Discover the art of Murano glass,"

        +

        "<br>"

        +

        "live in our furnace.";


    }


  }



  updateCountdown();


  setInterval(
    updateCountdown,
    250
  );


})();

</script>


</body>
</html>

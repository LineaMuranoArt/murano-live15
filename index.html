<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Linea Murano Art - Live Glass</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020304;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

.page{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 22% 42%,
        rgba(60,70,80,.10),
        transparent 34%),

        radial-gradient(circle at 76% 50%,
        rgba(255,35,20,.045),
        transparent 38%),

        linear-gradient(
        135deg,
        #020304,
        #080a0c 48%,
        #010101
        );
}


/* =====================================
   LOGO
===================================== */

.logo{
    position:absolute;
    left:3.1vw;
    top:3.2vh;
    z-index:10;
}

.logo-linea{
    font-size:2.65vw;
    line-height:.9;
    font-weight:300;
    letter-spacing:.45vw;

    background:
        linear-gradient(
        180deg,
        #fff 0%,
        #eee 35%,
        #777 60%,
        #fafafa 100%
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo-sub{
    margin-top:.75vh;
    margin-left:.2vw;

    font-size:.67vw;
    letter-spacing:.43vw;

    color:#aaa;
}


/* =====================================
   COLONNA SINISTRA
===================================== */

.left{
    position:absolute;
    left:3vw;
    top:16vh;

    width:39vw;
}


/* =====================================
   LIVE
===================================== */

.live-pill{

    display:inline-flex;
    align-items:center;

    gap:1.15vw;

    padding:
        1.35vh
        2.1vw
        1.35vh
        1.35vw;

    border-radius:999px;

    border:
        2px solid
        #ff342c;

    background:
        linear-gradient(
        180deg,
        rgba(225,20,15,.90),
        rgba(115,0,0,.94)
        );

    box-shadow:
        0 0 15px rgba(255,25,15,.55),
        0 0 35px rgba(255,25,15,.20),
        inset 0 1px 2px rgba(255,255,255,.32);
}


.live-dot{

    width:2.4vw;
    height:2.4vw;

    min-width:22px;
    min-height:22px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #fff,
        0 0 18px #ff4b42,
        0 0 30px #ff2118;

    animation:
        pulse
        1.5s
        infinite;
}


@keyframes pulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.75;
        transform:scale(.88);
    }
}


.live-text{

    font-size:2.8vw;
    font-weight:600;

    letter-spacing:.10vw;

    background:
        linear-gradient(
        180deg,
        #fff,
        #e6e6e6 45%,
        #aaa 70%,
        #fff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}


/* =====================================
   TITOLO
===================================== */

.title{

    margin-top:3.2vh;

    font-size:3.05vw;
    line-height:1.08;

    font-weight:600;

    letter-spacing:.02vw;

    background:
        linear-gradient(
        180deg,
        #fff 0%,
        #dedede 38%,
        #777 63%,
        #eee 100%
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}


.every-row{

    margin-top:2.3vh;

    display:flex;
    align-items:center;

    gap:1.2vw;
}


.blue-line{

    width:6.5vw;
    height:2px;

    background:
        linear-gradient(
        90deg,
        transparent,
        #00a8ff
        );

    box-shadow:
        0 0 6px
        rgba(0,168,255,.45);
}


.red-line{

    width:6.5vw;
    height:2px;

    background:
        linear-gradient(
        90deg,
        #ff2118,
        transparent
        );

    box-shadow:
        0 0 6px
        rgba(255,33,24,.45);
}


.every{

    white-space:nowrap;

    font-size:1.1vw;

    letter-spacing:.35vw;

    color:#ddd;
}


/* =====================================
   PANNELLO COUNTDOWN
===================================== */

.timer-panel{

    position:relative;

    margin-top:2.3vh;

    width:37vw;
    height:19vh;

    min-height:150px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    clip-path:
        polygon(
        7% 0,
        94% 0,
        100% 18%,
        100% 82%,
        94% 100%,
        7% 100%,
        0 82%,
        0 18%
        );

    background:
        linear-gradient(
        110deg,
        #050709 0%,
        #15191d 48%,
        #050506 100%
        );

    border:
        1px solid
        #555;

    box-shadow:
        inset 0 0 35px rgba(255,255,255,.035),
        0 0 25px rgba(0,0,0,.8);
}


.timer-panel:before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
        90deg,
        rgba(0,170,255,.70),
        transparent 20%,
        transparent 80%,
        rgba(255,30,20,.70)
        );

    opacity:.27;
}


/* =====================================
   DISPLAY DIGITALE
===================================== */

.digital-display{

    position:relative;
    z-index:3;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:.55vw;

    width:100%;
}


/* singolo numero */

.digit{

    position:relative;

    width:5.2vw;
    height:10.3vw;

    max-height:15vh;

    min-width:48px;
    min-height:92px;
}


/* segmento */

.segment{

    position:absolute;

    opacity:.065;

    background:#333;

    transition:
        opacity .08s linear;
}


/* segmento attivo */

.segment.on{

    opacity:1;

    background:
        linear-gradient(
        180deg,
        #ffffff 0%,
        #eeeeee 18%,
        #9c9c9c 48%,
        #f6f6f6 76%,
        #777 100%
        );

    box-shadow:
        inset 0 0 3px rgba(255,255,255,.8),
        inset 0 -2px 4px rgba(0,0,0,.7),
        0 2px 3px rgba(0,0,0,.8);

}


/* A alto */

.seg-a{

    top:0;
    left:17%;

    width:66%;
    height:11%;

    clip-path:
        polygon(
        8% 0,
        92% 0,
        100% 50%,
        92% 100%,
        8% 100%,
        0 50%
        );
}


/* B destra alto */

.seg-b{

    right:0;
    top:7%;

    width:17%;
    height:41%;

    clip-path:
        polygon(
        50% 0,
        100% 10%,
        100% 90%,
        50% 100%,
        0 90%,
        0 10%
        );
}


/* C destra basso */

.seg-c{

    right:0;
    bottom:7%;

    width:17%;
    height:41%;

    clip-path:
        polygon(
        50% 0,
        100% 10%,
        100% 90%,
        50% 100%,
        0 90%,
        0 10%
        );
}


/* D basso */

.seg-d{

    bottom:0;
    left:17%;

    width:66%;
    height:11%;

    clip-path:
        polygon(
        8% 0,
        92% 0,
        100% 50%,
        92% 100%,
        8% 100%,
        0 50%
        );
}


/* E sinistra basso */

.seg-e{

    left:0;
    bottom:7%;

    width:17%;
    height:41%;

    clip-path:
        polygon(
        50% 0,
        100% 10%,
        100% 90%,
        50% 100%,
        0 90%,
        0 10%
        );
}


/* F sinistra alto */

.seg-f{

    left:0;
    top:7%;

    width:17%;
    height:41%;

    clip-path:
        polygon(
        50% 0,
        100% 10%,
        100% 90%,
        50% 100%,
        0 90%,
        0 10%
        );
}


/* G centro */

.seg-g{

    top:44.5%;
    left:17%;

    width:66%;
    height:11%;

    clip-path:
        polygon(
        8% 0,
        92% 0,
        100% 50%,
        92% 100%,
        8% 100%,
        0 50%
        );
}


/* =====================================
   DUE PUNTI ROSSI
===================================== */

.colon{

    width:2.1vw;
    height:8vw;

    min-width:20px;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:1.4vw;
}


.colon-dot{

    width:1.05vw;
    height:1.05vw;

    min-width:10px;
    min-height:10px;

    border-radius:25%;

    background:#ff2018;

    box-shadow:
        0 0 5px #ff2018,
        0 0 12px rgba(255,32,24,.70);
}


/* =====================================
   NEXT
===================================== */

.next{

    margin-top:2vh;

    text-align:center;

    font-size:1.02vw;

    letter-spacing:.34vw;

    color:#ff3027;
}


.next-line{

    width:30vw;
    max-width:90%;

    height:1px;

    margin:
        .8vh auto 0;

    background:
        linear-gradient(
        90deg,
        transparent,
        #555,
        #ff3027,
        #555,
        transparent
        );
}


.next-dot{

    width:9px;
    height:9px;

    margin:
        -5px auto 0;

    border-radius:50%;

    background:#ff3027;

    box-shadow:
        0 0 6px #ff3027,
        0 0 13px rgba(255,48,39,.7);
}


#message{

    margin-top:2.1vh;

    padding-left:1.3vw;

    border-left:
        2px solid
        #ff3027;

    font-size:1.18vw;

    line-height:1.45;

    color:#e5e5e5;
}


/* =====================================
   AVATAR
===================================== */

.avatar-zone{

    position:absolute;

    right:2.8vw;
    top:9.5vh;

    width:52vw;
    height:74vh;

    border-radius:24px;

    overflow:hidden;

    background:#000;

    border:
        1px solid
        rgba(255,255,255,.14);

    box-shadow:
        -2px 0 0 #00a8ff,
        2px 0 0 #ff2118,
        0 0 28px rgba(0,0,0,.8);
}


.avatar-zone:after{

    content:"";

    position:absolute;
    inset:0;

    z-index:30;

    pointer-events:none;

    border-radius:23px;

    box-shadow:
        inset 2px 0 3px rgba(0,168,255,.55),
        inset -2px 0 3px rgba(255,33,24,.55);
}


/* finestra che ritaglia YouTube */

.video-crop{

    position:absolute;

    inset:0;

    overflow:hidden;

    background:#000;
}


/*
  PLAYER MOLTO PIÙ GRANDE
  E ALZATO
*/

#player{

    position:absolute;

    left:0;
    top:0;

    width:100% !important;
    height:100% !important;

    border:0;
}


/* =====================================
   MASCHERA SOTTOTITOLI
===================================== */

/*
  La maschera copre fisicamente
  la zona dove YouTube mette captions.

  L'avatar viene posizionato affinché
  il busto arrivi praticamente
  fino a questa maschera.
*/

.subtitle-mask{

    position:absolute;

    z-index:18;

    left:0;
    right:0;
    bottom:0;

    height:17%;

    pointer-events:none;

    background:
        linear-gradient(
        180deg,
        rgba(2,3,4,0) 0%,
        rgba(2,3,4,.78) 30%,
        rgba(2,3,4,.98) 62%,
        #020304 100%
        );
}


/* =====================================
   START FALLBACK
===================================== */

#startOverlay{

    position:absolute;

    inset:0;

    z-index:40;

    display:none;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.73);

    cursor:pointer;
}


#startOverlay.show{

    display:flex;
}


.start-button{

    border:
        2px solid
        #ff3027;

    border-radius:999px;

    padding:
        1.1vh
        1.7vw;

    background:
        linear-gradient(
        180deg,
        #d51b14,
        #720000
        );

    color:#fff;

    font-size:1.05vw;

    font-weight:bold;

    letter-spacing:.12vw;

    box-shadow:
        0 0 20px
        rgba(255,30,20,.45);
}


.start-small{

    margin-top:1.2vh;

    font-size:.72vw;

    letter-spacing:.12vw;

    color:#aaa;
}


/* =====================================
   FOOTER
===================================== */

.footer{

    position:absolute;

    left:3vw;
    right:3vw;

    bottom:2.6vh;

    border-top:
        1px solid
        #343434;

    padding-top:2vh;

    text-align:center;

    font-size:.75vw;

    letter-spacing:.42vw;

    color:#888;
}


.footer-live{

    color:#ff3027;
}


/* ultimi 30 secondi */

.starting .timer-panel{

    box-shadow:
        inset 0 0 30px rgba(255,35,20,.08),
        0 0 28px rgba(255,30,20,.20);
}


.starting #message{

    color:#fff;

    font-weight:bold;

    border-left-color:#ff3027;
}


/* =====================================
   TV BASSE
===================================== */

@media(max-height:720px){

    .left{
        top:13.5vh;
    }

    .avatar-zone{
        top:8vh;
        height:76vh;
    }

}

</style>

</head>



<body>

<div class="page" id="page">


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-linea">
            LINEA
        </div>

        <div class="logo-sub">
            MURANO ART
        </div>

    </div>



    <!-- SINISTRA -->

    <section class="left">


        <div class="live-pill">

            <div class="live-dot"></div>

            <div class="live-text">
                LIVE
            </div>

        </div>



        <div class="title">

            LIVE GLASS-BLOWING<br>
            DEMONSTRATION

        </div>



        <div class="every-row">

            <div class="blue-line"></div>

            <div class="every">
                EVERY 15 MINUTES
            </div>

            <div class="red-line"></div>

        </div>



        <!-- COUNTDOWN DIGITALE -->

        <div class="timer-panel">


            <div class="digital-display">


                <div class="digit" id="digit1"></div>


                <div class="digit" id="digit2"></div>


                <div class="colon">

                    <div class="colon-dot"></div>

                    <div class="colon-dot"></div>

                </div>


                <div class="digit" id="digit3"></div>


                <div class="digit" id="digit4"></div>


            </div>


        </div>



        <div class="next">

            NEXT DEMONSTRATION

        </div>


        <div class="next-line"></div>


        <div class="next-dot"></div>



        <div id="message">

            Discover the art of Murano glass,<br>
            live in our furnace.

        </div>


    </section>



    <!-- VIDEO -->

    <aside class="avatar-zone">


        <div class="video-crop">

            <div id="player"></div>

        </div>


        <!-- MASCHERA SOTTOTITOLI -->

        <div class="subtitle-mask"></div>



        <!-- SOLO SE AUTOPLAY VIENE BLOCCATO -->

        <div id="startOverlay">

            <div class="start-button">

                ● &nbsp; START LIVE EXPERIENCE

            </div>

            <div class="start-small">

                TAP ONCE TO START

            </div>

        </div>


    </aside>



    <!-- FOOTER -->

    <footer class="footer">

        THE ART OF MURANO GLASS •

        <span class="footer-live">
            LIVE
        </span>

    </footer>


</div>



<script src="https://www.youtube.com/iframe_api"></script>


<script>


/* =====================================
   CREA SEGMENTI DIGITALI
===================================== */


const segments =
[
    "a",
    "b",
    "c",
    "d",
    "e",
    "f",
    "g"
];


const digitMap =
{

    0:["a","b","c","d","e","f"],

    1:["b","c"],

    2:["a","b","g","e","d"],

    3:["a","b","c","d","g"],

    4:["f","g","b","c"],

    5:["a","f","g","c","d"],

    6:["a","f","g","e","c","d"],

    7:["a","b","c"],

    8:["a","b","c","d","e","f","g"],

    9:["a","b","c","d","f","g"]

};


function buildDigit(element){

    segments.forEach(
        function(name){

            const segment =
                document.createElement("span");

            segment.className =
                "segment seg-" + name;

            segment.dataset.segment =
                name;

            element.appendChild(segment);

        }
    );

}


const digitElements =
[
    document.getElementById("digit1"),
    document.getElementById("digit2"),
    document.getElementById("digit3"),
    document.getElementById("digit4")
];


digitElements.forEach(buildDigit);



function setDigit(element,value){

    const active =
        digitMap[value] || [];


    element
    .querySelectorAll(".segment")
    .forEach(

        function(segment){

            if(
                active.includes(
                    segment.dataset.segment
                )
            ){

                segment
                .classList
                .add("on");

            }

            else{

                segment
                .classList
                .remove("on");

            }

        }

    );

}



/* =====================================
   YOUTUBE
===================================== */


let player;


function onYouTubeIframeAPIReady(){


    player =
        new YT.Player(
        "player",
        {

            width:
                "100%",

            height:
                "100%",

            videoId:
                "fmKCddzoTkY",


            playerVars:
            {

                autoplay:1,

                controls:0,

                rel:0,

                playsinline:1,

                disablekb:1,

                fs:0,

                loop:1,

                playlist:
                    "fmKCddzoTkY",

                iv_load_policy:3

            },


            events:
            {

                onReady:
                    attemptAutoStart,


                onStateChange:
                    playerStateChanged

            }

        }
    );

}



/*
  PROVA AUTOPLAY CON AUDIO.

  Se il browser lo consente,
  non compare nessun pulsante.

  Se il browser lo blocca,
  dopo poco compare START.
*/

function attemptAutoStart(event){


    try{

        event.target.setVolume(100);

        event.target.unMute();

        event.target.playVideo();

    }

    catch(e){}



    setTimeout(

        function(){

            try{

                if(
                    player.getPlayerState()
                    !==
                    YT.PlayerState.PLAYING
                ){

                    document
                    .getElementById(
                        "startOverlay"
                    )
                    .classList
                    .add("show");

                }

            }

            catch(e){

                document
                .getElementById(
                    "startOverlay"
                )
                .classList
                .add("show");

            }

        },

        1600

    );

}



function playerStateChanged(event){


    if(
        event.data ===
        YT.PlayerState.PLAYING
    ){

        document
        .getElementById(
            "startOverlay"
        )
        .classList
        .remove("show");

    }


    if(
        event.data ===
        YT.PlayerState.ENDED
    ){

        player.seekTo(0);

        player.playVideo();

    }

}



/* FALLBACK MANUALE */

document
.getElementById("startOverlay")
.addEventListener(

    "click",

    function(){


        player.unMute();

        player.setVolume(100);

        player.playVideo();


        this
        .classList
        .remove("show");


    }

);



/* =====================================
   COUNTDOWN
===================================== */


(function(){


    const page =
        document.getElementById(
            "page"
        );


    const message =
        document.getElementById(
            "message"
        );



    function updateCountdown(){


        const now =
            new Date();


        const minutes =
            now.getMinutes();


        const seconds =
            now.getSeconds();


        const milliseconds =
            now.getMilliseconds();



        let nextMinute;



        if(minutes < 15){

            nextMinute = 15;

        }

        else if(minutes < 30){

            nextMinute = 30;

        }

        else if(minutes < 45){

            nextMinute = 45;

        }

        else{

            nextMinute = 60;

        }



        let remaining =

            ((nextMinute - minutes) * 60)

            - seconds

            - (milliseconds / 1000);



        remaining =
            Math.ceil(remaining);



        if(remaining <= 0){

            remaining = 900;

        }



        const mins =
            Math.floor(
                remaining / 60
            );


        const secs =
            remaining % 60;



        const text =

            String(mins)
            .padStart(2,"0")

            +

            String(secs)
            .padStart(2,"0");



        setDigit(
            digitElements[0],
            Number(text[0])
        );


        setDigit(
            digitElements[1],
            Number(text[1])
        );


        setDigit(
            digitElements[2],
            Number(text[2])
        );


        setDigit(
            digitElements[3],
            Number(text[3])
        );



        if(remaining <= 30){


            page
            .classList
            .add("starting");


            message.innerHTML =

                "THE DEMONSTRATION IS ABOUT TO BEGIN"

                +

                "<br>"

                +

                "ACCESS TO THE FURNACE IS NOW PERMITTED";


        }


        else{


            page
            .classList
            .remove("starting");


            message.innerHTML =

                "Discover the art of Murano glass,"

                +

                "<br>"

                +

                "live in our furnace.";


        }


    }



    updateCountdown();


    setInterval(
        updateCountdown,
        250
    );


})();


</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murano Live Glass - 15 Minutes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 28% 42%,rgba(116,82,38,.18),transparent 35%),
        radial-gradient(circle at 75% 50%,rgba(85,55,25,.10),transparent 38%),
        linear-gradient(135deg,#050505 0%,#0b0b0b 45%,#020202 100%);
}

.page:before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(90deg,transparent 0%,rgba(210,172,96,.04) 48%,transparent 100%);
}

/* HEADER */

.header{
    position:absolute;
    top:4.5vh;
    left:5vw;
    right:5vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    flex-direction:column;
}

.logo-main{
    font-family:Georgia,"Times New Roman",serif;
    font-size:2.15vw;
    letter-spacing:.34vw;
    color:#fff;
}

.logo-sub{
    margin-top:.5vh;
    font-size:.72vw;
    letter-spacing:.34vw;
    color:#d2ab63;
}

.header-line{
    position:absolute;
    left:5vw;
    right:5vw;
    top:11vh;
    height:1px;
    background:linear-gradient(90deg,#b88a40,rgba(184,138,64,.15),transparent);
}

/* MAIN LEFT */

.main-left{
    position:absolute;
    left:5vw;
    top:17vh;
    width:57vw;
}

.kicker{
    font-size:.88vw;
    letter-spacing:.34vw;
    color:#d2ab63;
    margin-bottom:1.6vh;
}

.title{
    font-family:Georgia,"Times New Roman",serif;
    font-size:4.65vw;
    line-height:.98;
    letter-spacing:.04vw;
    font-weight:normal;
}

.subtitle{
    margin-top:2.2vh;
    font-size:1.18vw;
    letter-spacing:.30vw;
    color:#cfcfcf;
}

.timer-wrap{
    margin-top:1.2vh;
}

#countdown{
    font-size:13.8vw;
    line-height:.88;
    font-weight:200;
    letter-spacing:-.45vw;
    font-variant-numeric:tabular-nums;
    transition:color .3s ease,text-shadow .3s ease;
}

.next{
    margin-top:1.5vh;
    font-size:.86vw;
    letter-spacing:.30vw;
    color:#d2ab63;
}

#message{
    margin-top:1vh;
    font-size:1.15vw;
    line-height:1.45;
    color:#dcdcdc;
    max-width:48vw;
}

/* AVATAR AREA */

.avatar-zone{
    position:absolute;
    right:4.5vw;
    top:17vh;
    width:31vw;
    height:68vh;
}

.avatar-frame{
    position:absolute;
    inset:0;
    border:1px solid rgba(210,171,99,.35);
    background:
        radial-gradient(circle at 50% 35%,rgba(210,171,99,.10),transparent 46%),
        linear-gradient(180deg,#111 0%,#080808 100%);
    overflow:hidden;
}

.avatar-frame:before{
    content:"";
    position:absolute;
    inset:12px;
    border:1px solid rgba(255,255,255,.035);
    pointer-events:none;
}

.avatar-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#8f8f8f;
}

.avatar-placeholder .circle{
    width:7vw;
    height:7vw;
    border-radius:50%;
    border:1px solid rgba(210,171,99,.50);
    margin-bottom:2.2vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.5vw;
    color:#d2ab63;
}

.avatar-placeholder .small{
    font-size:.75vw;
    letter-spacing:.25vw;
    color:#c7a25e;
}

.avatar-placeholder .text{
    margin-top:1vh;
    font-size:1vw;
    line-height:1.5;
    color:#9a9a9a;
}

/* VIDEO AVATAR - ready for later */

#avatarVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

/* BOTTOM */

.bottom{
    position:absolute;
    left:5vw;
    right:5vw;
    bottom:3.7vh;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#777;
    font-size:.70vw;
    letter-spacing:.24vw;
}

.bottom-line{
    position:absolute;
    left:0;
    right:0;
    top:-2vh;
    height:1px;
    background:linear-gradient(90deg,rgba(210,171,99,.55),rgba(210,171,99,.12),transparent);
}

/* LAST 30 SECONDS */

.starting #countdown{
    color:#e3bd6d;
    text-shadow:0 0 30px rgba(227,189,109,.18);
}

.starting #message{
    color:#fff;
    font-size:1.4vw;
    font-weight:bold;
    letter-spacing:.03vw;
}

/* RESPONSIVE */

@media(max-height:720px){
    .main-left{top:15vh}
    .avatar-zone{top:15vh;height:70vh}
    #countdown{font-size:12.5vw}
    .title{font-size:4.3vw}
}
</style>
</head>

<body>

<div class="page" id="page">

    <div class="header">
        <div class="logo">
            <div class="logo-main">MURANO</div>
            <div class="logo-sub">LIVE GLASS EXPERIENCE</div>
        </div>

        <div style="
        font-size:.72vw;
        letter-spacing:.25vw;
        color:#8c8c8c;
        ">
        LINEA MURANO ART
        </div>
    </div>

    <div class="header-line"></div>


    <section class="main-left">

        <div class="kicker">
            LIVE IN MURANO
        </div>

        <h1 class="title">
            LIVE GLASS-BLOWING<br>
            DEMONSTRATION
        </h1>

        <div class="subtitle">
            EVERY 15 MINUTES
        </div>

        <div class="timer-wrap">
            <div id="countdown">15:00</div>
        </div>

        <div class="next">
            NEXT DEMONSTRATION
        </div>

        <div id="message">
            Discover the art of Murano glass, live in our furnace.
        </div>

    </section>


    <aside class="avatar-zone">

        <div class="avatar-frame">

            <video id="avatarVideo"
                   autoplay
                   muted
                   playsinline
                   loop>
            </video>

            <div class="avatar-placeholder" id="avatarPlaceholder">

                <div class="circle">M</div>

                <div class="small">
                    MURANO LIVE GUIDE
                </div>

                <div class="text">
                    Avatar presentation<br>
                    will appear here
                </div>

            </div>

        </div>

    </aside>


    <footer class="bottom">

        <div class="bottom-line"></div>

        <div>
            THE ART OF MURANO GLASS • LIVE
        </div>

        <div>
            VENICE • ITALY
        </div>

    </footer>

</div>


<script>
(function(){

    const page = document.getElementById("page");
    const countdown = document.getElementById("countdown");
    const message = document.getElementById("message");

    function updateCountdown(){

        const now = new Date();

        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const milliseconds = now.getMilliseconds();

        let nextMinute;

        if(minutes < 15){
            nextMinute = 15;
        }
        else if(minutes < 30){
            nextMinute = 30;
        }
        else if(minutes < 45){
            nextMinute = 45;
        }
        else{
            nextMinute = 60;
        }

        let remaining =
            ((nextMinute - minutes) * 60)
            - seconds
            - (milliseconds / 1000);

        remaining = Math.ceil(remaining);

        if(remaining <= 0){
            remaining = 900;
        }

        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;

        countdown.textContent =
            String(mins).padStart(2,"0") +
            ":" +
            String(secs).padStart(2,"0");

        if(remaining <= 30){

            page.classList.add("starting");

            message.innerHTML =
                "THE DEMONSTRATION IS ABOUT TO BEGIN<br>" +
                "ACCESS TO THE FURNACE IS NOW PERMITTED";

        }
        else{

            page.classList.remove("starting");

            message.innerHTML =
                "Discover the art of Murano glass, live in our furnace.";
        }
    }

    updateCountdown();
    setInterval(updateCountdown,250);

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Linea Murano Art - Live Glass</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020304;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

.page{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 22% 42%,rgba(60,70,80,.10),transparent 34%),
    radial-gradient(circle at 76% 50%,rgba(255,35,20,.045),transparent 38%),
    linear-gradient(135deg,#020304,#080a0c 48%,#010101);
}

/* LOGO */

.logo{
  position:absolute;
  left:3.1vw;
  top:3.2vh;
  z-index:10;
}

.logo-linea{
  font-size:2.65vw;
  line-height:.9;
  font-weight:300;
  letter-spacing:.45vw;
  background:linear-gradient(
    180deg,
    #ffffff 0%,
    #eeeeee 35%,
    #777 60%,
    #fafafa 100%
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.logo-sub{
  margin-top:.75vh;
  margin-left:.2vw;
  font-size:.67vw;
  letter-spacing:.43vw;
  color:#aaa;
}

/* LEFT */

.left{
  position:absolute;
  left:3vw;
  top:16.5vh;
  width:39vw;
}

/* LIVE */

.live-pill{
  display:inline-flex;
  align-items:center;
  gap:1.15vw;
  padding:1.35vh 2.1vw 1.35vh 1.35vw;
  border-radius:999px;
  border:2px solid #ff342c;
  background:linear-gradient(
    180deg,
    rgba(225,20,15,.90),
    rgba(115,0,0,.94)
  );
  box-shadow:
    0 0 15px rgba(255,25,15,.55),
    0 0 35px rgba(255,25,15,.20),
    inset 0 1px 2px rgba(255,255,255,.32);
}

.live-dot{
  width:2.4vw;
  height:2.4vw;
  min-width:22px;
  min-height:22px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 8px #fff,
    0 0 18px #ff4b42,
    0 0 30px #ff2118;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }
  50%{
    opacity:.75;
    transform:scale(.88);
  }
}

.live-text{
  font-size:2.8vw;
  font-weight:600;
  letter-spacing:.10vw;
  background:linear-gradient(
    180deg,
    #fff,
    #e6e6e6 45%,
    #aaa 70%,
    #fff
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* TITLE */

.title{
  margin-top:3.2vh;
  font-size:3.1vw;
  line-height:1.08;
  letter-spacing:.025vw;
  font-weight:600;
  background:linear-gradient(
    180deg,
    #ffffff 0%,
    #dedede 38%,
    #777 63%,
    #eeeeee 100%
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.every-row{
  margin-top:2.3vh;
  display:flex;
  align-items:center;
  gap:1.2vw;
}

.blue-line{
  width:6.5vw;
  height:2px;
  background:linear-gradient(90deg,transparent,#00a8ff);
  box-shadow:0 0 6px rgba(0,168,255,.45);
}

.red-line{
  width:6.5vw;
  height:2px;
  background:linear-gradient(90deg,#ff2118,transparent);
  box-shadow:0 0 6px rgba(255,33,24,.45);
}

.every{
  white-space:nowrap;
  font-size:1.1vw;
  letter-spacing:.35vw;
  color:#ddd;
}

/* TIMER */

.timer-panel{
  position:relative;
  margin-top:2.4vh;
  width:37vw;
  height:18.5vh;
  min-height:145px;
  display:flex;
  align-items:center;
  justify-content:center;

  clip-path:polygon(
    7% 0,
    94% 0,
    100% 18%,
    100% 82%,
    94% 100%,
    7% 100%,
    0 82%,
    0 18%
  );

  background:linear-gradient(
    110deg,
    #050709 0%,
    #161a1e 48%,
    #050506 100%
  );

  border:1px solid #555;

  box-shadow:
    inset 0 0 30px rgba(255,255,255,.035),
    0 0 25px rgba(0,0,0,.8);
}

.timer-panel:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:linear-gradient(
    90deg,
    rgba(0,170,255,.8),
    transparent 22%,
    transparent 78%,
    rgba(255,30,20,.8)
  );

  opacity:.28;
}

#countdown{
  position:relative;
  z-index:2;

  font-family:"Arial Narrow",Arial,sans-serif;
  font-size:9.3vw;
  line-height:.8;
  font-weight:700;
  letter-spacing:-.45vw;
  font-variant-numeric:tabular-nums;

  background:linear-gradient(
    180deg,
    #ffffff 0%,
    #f5f5f5 28%,
    #888 58%,
    #d8d8d8 78%,
    #fff 100%
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  filter:
    drop-shadow(0 2px 1px #000)
    drop-shadow(0 0 5px rgba(255,255,255,.12));
}

/* NEXT */

.next{
  margin-top:2.2vh;
  text-align:center;
  font-size:1.02vw;
  letter-spacing:.34vw;
  color:#ff3027;
}

.next-line{
  width:30vw;
  max-width:90%;
  height:1px;
  margin:.8vh auto 0;

  background:linear-gradient(
    90deg,
    transparent,
    #555,
    #ff3027,
    #555,
    transparent
  );
}

.next-dot{
  width:9px;
  height:9px;
  margin:-5px auto 0;
  border-radius:50%;
  background:#ff3027;

  box-shadow:
    0 0 6px #ff3027,
    0 0 13px rgba(255,48,39,.7);
}

#message{
  margin-top:2.1vh;
  padding-left:1.3vw;
  border-left:2px solid #ff3027;
  font-size:1.18vw;
  line-height:1.45;
  color:#e5e5e5;
}

/* AVATAR */

.avatar-zone{
  position:absolute;
  right:2.8vw;
  top:10.5vh;
  width:52vw;
  height:72vh;
  border-radius:24px;
  overflow:hidden;
  background:#000;

  border:1px solid rgba(255,255,255,.14);

  box-shadow:
    -2px 0 0 #00a8ff,
    2px 0 0 #ff2118,
    0 0 28px rgba(0,0,0,.8);
}

.avatar-zone:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  border-radius:23px;
  border-top:1px solid rgba(255,255,255,.12);

  box-shadow:
    inset 2px 0 3px rgba(0,168,255,.55),
    inset -2px 0 3px rgba(255,33,24,.55);
}

/* VIDEO: più alto e leggermente meno zoomato */

#player{
  position:absolute;

  top:46%;
  left:50%;

  width:112%;
  height:112%;

  transform:translate(-50%,-50%);
  border:0;
}

/* START AUDIO */

#startOverlay{
  position:absolute;
  inset:0;
  z-index:20;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.76);
  cursor:pointer;
}

#startOverlay.hidden{
  display:none;
}

.start-button{
  display:flex;
  align-items:center;
  gap:.8vw;

  border:2px solid #ff3027;
  border-radius:999px;

  padding:1.1vh 1.7vw;

  background:linear-gradient(
    180deg,
    #d51b14,
    #720000
  );

  color:#fff;
  font-size:1.05vw;
  font-weight:bold;
  letter-spacing:.12vw;

  box-shadow:
    0 0 20px rgba(255,30,20,.45);
}

.start-small{
  margin-top:1.2vh;
  font-size:.72vw;
  letter-spacing:.12vw;
  color:#aaa;
}

/* FOOTER */

.footer{
  position:absolute;
  left:3vw;
  right:3vw;
  bottom:2.6vh;

  border-top:1px solid #343434;
  padding-top:2vh;

  text-align:center;

  font-size:.75vw;
  letter-spacing:.42vw;
  color:#888;
}

.footer-live{
  color:#ff3027;
}

/* LAST 30 SECONDS */

.starting .timer-panel{
  box-shadow:
    inset 0 0 30px rgba(255,35,20,.08),
    0 0 28px rgba(255,30,20,.20);
}

.starting #message{
  color:#fff;
  font-weight:bold;
  border-left-color:#ff3027;
}

@media(max-height:720px){

  .left{
    top:14vh;
  }

  .avatar-zone{
    top:9vh;
    height:74vh;
  }

  .title{
    font-size:2.8vw;
  }

  .timer-panel{
    height:17vh;
  }

  #countdown{
    font-size:8.6vw;
  }
}
</style>
</head>

<body>

<div class="page" id="page">

  <div class="logo">
    <div class="logo-linea">LINEA</div>
    <div class="logo-sub">MURANO ART</div>
  </div>

  <section class="left">

    <div class="live-pill">
      <div class="live-dot"></div>
      <div class="live-text">LIVE</div>
    </div>

    <div class="title">
      LIVE GLASS-BLOWING<br>
      DEMONSTRATION
    </div>

    <div class="every-row">
      <div class="blue-line"></div>
      <div class="every">EVERY 15 MINUTES</div>
      <div class="red-line"></div>
    </div>

    <div class="timer-panel">
      <div id="countdown">15:00</div>
    </div>

    <div class="next">
      NEXT DEMONSTRATION
    </div>

    <div class="next-line"></div>
    <div class="next-dot"></div>

    <div id="message">
      Discover the art of Murano glass,<br>
      live in our furnace.
    </div>

  </section>

  <aside class="avatar-zone">

    <div id="player"></div>

    <div id="startOverlay">

      <div class="start-button">
        ● &nbsp; START LIVE EXPERIENCE
      </div>

      <div class="start-small">
        TAP ONCE TO ENABLE AUDIO
      </div>

    </div>

  </aside>

  <footer class="footer">
    THE ART OF MURANO GLASS •
    <span class="footer-live">LIVE</span>
  </footer>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;

function onYouTubeIframeAPIReady(){

  player = new YT.Player("player",{

    videoId:"fnaTZhE2lyo",

    playerVars:{
      autoplay:0,
      controls:0,
      rel:0,
      modestbranding:1,
      playsinline:1,
      disablekb:1,
      fs:0,
      loop:1,
      playlist:"fnaTZhE2lyo"
    },

    events:{

      onReady:function(event){

        /* prova a disattivare captions del player */

        try{
          event.target.unloadModule("captions");
        }catch(e){}

      },

      onStateChange:function(event){

        if(event.data === YT.PlayerState.ENDED){

          player.seekTo(0);
          player.playVideo();

        }

      }

    }

  });

}


/* START AUDIO */

document
.getElementById("startOverlay")
.addEventListener("click",function(){

  if(player){

    try{
      player.unloadModule("captions");
    }catch(e){}

    player.unMute();
    player.setVolume(100);
    player.playVideo();

    document
      .getElementById("startOverlay")
      .classList.add("hidden");
  }

});


/* COUNTDOWN */

(function(){

  const page =
    document.getElementById("page");

  const countdown =
    document.getElementById("countdown");

  const message =
    document.getElementById("message");


  function updateCountdown(){

    const now =
      new Date();

    const minutes =
      now.getMinutes();

    const seconds =
      now.getSeconds();

    const milliseconds =
      now.getMilliseconds();

    let nextMinute;

    if(minutes < 15){
      nextMinute = 15;
    }
    else if(minutes < 30){
      nextMinute = 30;
    }
    else if(minutes < 45){
      nextMinute = 45;
    }
    else{
      nextMinute = 60;
    }

    let remaining =
      ((nextMinute - minutes) * 60)
      - seconds
      - (milliseconds / 1000);

    remaining =
      Math.ceil(remaining);

    if(remaining <= 0){
      remaining = 900;
    }

    const mins =
      Math.floor(remaining / 60);

    const secs =
      remaining % 60;

    countdown.textContent =
      String(mins).padStart(2,"0")
      + ":"
      + String(secs).padStart(2,"0");

    if(remaining <= 30){

      page.classList.add("starting");

      message.innerHTML =
        "THE DEMONSTRATION IS ABOUT TO BEGIN"
        + "<br>"
        + "ACCESS TO THE FURNACE IS NOW PERMITTED";

    }
    else{

      page.classList.remove("starting");

      message.innerHTML =
        "Discover the art of Murano glass,"
        + "<br>"
        + "live in our furnace.";

    }
  }

  updateCountdown();

  setInterval(
    updateCountdown,
    250
  );

})();

</script>

</body>
</html>
